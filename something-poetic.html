<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something Poetic, Something Politic · Natalie Almasri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cream:#FAF7F2; --cream2:#F3EDE3; --parchment:#EDE3D5;
      --lavender:#C8B4E8; --lavender2:#B09AD8; --lavender3:#8B6FC4;
      --ink:#1C1720; --ink2:#3A2F45; --ink3:#6B5F7A;
      --sage2:#7EA878;
      --font-display:'Cormorant Garamond',Georgia,serif;
      --font-body:'DM Sans',system-ui,sans-serif;
      --ease-out:cubic-bezier(0.16,1,0.3,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--cream);color:var(--ink);font-family:var(--font-body);font-weight:300;overflow-x:hidden;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:var(--cream2);}
    ::-webkit-scrollbar-thumb{background:var(--lavender2);border-radius:2px;}
    .article-nav{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,5vw,64px);background:rgba(250,247,242,0.88);backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(200,180,232,0.25);transition:transform 0.45s var(--ease-out);}
    .article-nav.nav-hidden{transform:translateY(-100%);}
    .back-link{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-body);font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink3);text-decoration:none;transition:color 0.3s,gap 0.3s var(--ease-out);}
    .back-link:hover{color:var(--lavender3);gap:14px;}
    .article-nav .brand{grid-column:2;justify-self:center;display:flex;align-items:center;height:42px;text-decoration:none;}
    .article-nav .brand img{height:100%;width:auto;display:block;}
    .article-hero{padding:calc(64px + 60px) clamp(20px,5vw,64px) 0;max-width:860px;margin:0 auto;text-align:center;}
    .article-tag{font-family:var(--font-body);font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--lavender3);margin-bottom:24px;opacity:0;animation:fadeUp 0.9s 0.1s var(--ease-out) forwards;}
    .article-title{font-family:var(--font-display);font-weight:300;font-size:clamp(2.6rem,6vw,5rem);line-height:1.02;color:var(--ink2);margin-bottom:12px;opacity:0;animation:fadeUp 0.9s 0.25s var(--ease-out) forwards;}
    .article-subtitle{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:clamp(1.3rem,3vw,2rem);color:var(--lavender3);margin-bottom:28px;opacity:0;animation:fadeUp 0.9s 0.35s var(--ease-out) forwards;}
    .article-meta{font-family:var(--font-body);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:48px;opacity:0;animation:fadeUp 0.9s 0.45s var(--ease-out) forwards;}
    .article-intro{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:clamp(1.2rem,2.4vw,1.6rem);line-height:1.55;color:var(--ink3);max-width:640px;margin:0 auto 56px;opacity:0;animation:fadeUp 0.9s 0.55s var(--ease-out) forwards;}
    .article-body{max-width:760px;margin:0 auto;padding:0 clamp(24px,6vw,40px) 40px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @media(max-width:600px){.article-nav .brand{display:none;}}
    .article-p{font-family:var(--font-body);font-size:1rem;line-height:1.8;color:var(--ink2);margin-bottom:22px;text-wrap:pretty;}
    .article-h2{font-family:var(--font-display);font-size:clamp(1.6rem,3vw,2.1rem);font-weight:500;color:var(--ink2);line-height:1.12;margin:8px 0 18px;}
    .book-meta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 56px;}
    .book-meta-item{font-family:var(--font-body);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);border:1.5px solid var(--parchment);padding:6px 14px;}
    .download-section{text-align:center;padding:48px clamp(24px,6vw,40px) 96px;border-top:1px solid var(--parchment);max-width:760px;margin:0 auto;}
    .download-note{font-family:var(--font-body);font-size:0.85rem;color:var(--ink3);margin-bottom:24px;}
    .btn-download{
      display:inline-flex;align-items:center;gap:10px;
      padding:15px 34px;
      background:var(--lavender3);color:#fff;
      font-family:var(--font-body);font-size:0.8rem;
      letter-spacing:0.14em;text-transform:uppercase;
      text-decoration:none;border:none;cursor:pointer;
      transition:background 0.3s,transform 0.3s var(--ease-out),box-shadow 0.3s;
      box-shadow:0 6px 24px rgba(139,111,196,0.28);
    }
    .btn-download:hover{background:var(--lavender2);transform:translateY(-2px);box-shadow:0 12px 36px rgba(139,111,196,0.38);}
  
    .poster{width:100%;max-width:560px;margin:0 auto 64px;box-shadow:0 30px 70px rgba(28,23,32,0.25);opacity:0;animation:fadeIn 1.2s 0.5s var(--ease-out) forwards;}
    .poster img{display:block;width:100%;height:auto;}
    .detail-list{list-style:none;margin:0 0 40px;}
    .detail-list li{font-family:var(--font-body);font-size:1rem;line-height:1.8;color:var(--ink2);padding:10px 0;border-bottom:1px solid var(--parchment);}
    .detail-list strong{font-weight:500;display:block;font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--lavender3);}
    .photo-section{max-width:1100px;margin:0 auto;padding:16px clamp(24px,6vw,40px) 96px;}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;margin-top:24px;}
    .photo-grid a{display:block;overflow:hidden;background:var(--cream2);aspect-ratio:4/3;}
    .photo-grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s var(--ease-out);}
    .photo-grid a:hover img{transform:scale(1.04);}
  </style>
</head>
<body>
  <nav class="article-nav">
    <a href="index.html#exhibitions" class="back-link">← Back to Exhibitions</a>
    <a href="index.html" class="brand"><img src="uploads/signature-cropped.png" alt="Natalie Almasri" /></a>
  </nav>

  <header class="article-hero">
    <p class="article-tag">Exhibition · 2022</p>
    <h1 class="article-title">Something Poetic, Something Politic</h1>
    <p class="article-meta">Iuav University · Venice, Italy</p>
  </header>

  <article class="article-body">
    <ul class="detail-list">
      <li><strong>Venue</strong>Iuav University, Venice, Italy</li>
      <li><strong>Medium</strong>Mixed media</li>
    </ul>
  </article>

  <section class="photo-section">
    <h2 class="article-h2">From the exhibition</h2>
    <div class="photo-grid">
      <a href="uploads/exhibition-something-poetic.jpg" target="_blank" rel="noopener"><img src="uploads/exhibition-something-poetic.jpg" alt="Something Poetic, Something Politic, mixed media installation" loading="lazy" /></a>
      <a href="uploads/something-poetic-5083.jpg" target="_blank" rel="noopener"><img src="uploads/something-poetic-5083.jpg" alt="Terracotta pot with rosemary, a box and broken tiles on a balcony" loading="lazy" /></a>
      <a href="uploads/something-poetic-5086.jpg" target="_blank" rel="noopener"><img src="uploads/something-poetic-5086.jpg" alt="Inside the box, seen from above, surrounded by rosemary" loading="lazy" /></a>
    </div>
  </section>

  <script>
  (function () {
    var nav = document.querySelector('.article-nav');
    var lastY = window.scrollY, ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        var y = window.scrollY;
        if (y <= 20) nav.classList.remove('nav-hidden');
        else if (y > lastY) nav.classList.add('nav-hidden');
        else if (lastY - y > 40) nav.classList.remove('nav-hidden');
        lastY = y; ticking = false;
      });
    }, { passive: true });
  })();
  </script>
</body>
</html>
